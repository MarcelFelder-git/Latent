<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141210" />

    <!-- Auf dem iPhone startet die installierte App dadurch ohne Browserleiste.
         Die Statusleiste liegt ueber der Seite; die Einschuebe dafuer stehen
         am Ende von index.css. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Latent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Latent — Filmemulation im Browser</title>
    <meta name="description" content="Fotos durch echte Filmemulation entwickeln: Dichtekurve pro Farbschicht, Lichthof, Korn, Scannerprofile. Laeuft komplett lokal im Browser." />

    <!-- Vorschaukarte, wenn der Link geteilt wird. Als Bild dient vorerst die
         Marke; ein Screenshot waere besser, dann aber als large_image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Latent" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:title" content="Latent — Filmemulation im Browser" />
    <meta property="og:description" content="Dichtekurve pro Farbschicht, wellenlaengenabhaengiger Lichthof, belichtungsabhaengiges Korn, Scannerprofile. Ohne Upload, ohne Konto." />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
